# Baut die Ansicht des Registers (tools/scripts/truth_ansicht.py) bei jedem Push
# auf master und veroeffentlicht sie ueber GitHub Pages. Im Repository liegt
# keine erzeugte Datei: die Seite entsteht jedes Mal neu aus research/TRUTH.csv,
# git log und dem Validator. Voraussetzung, einmal im Repository einzustellen:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Register view

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # ganze Historie, sonst bleibt das Laborjournal leer
          lfs: false                # die Ansicht braucht keine LFS-Dateien
          persist-credentials: false
      - name: Graphviz installieren (ordnet den Graphen der Abhaengigkeiten an)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends graphviz
      - name: Ansicht erzeugen
        run: >
          python3 tools/scripts/truth_ansicht.py --out _site/index.html
          --commit-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/{hash}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
